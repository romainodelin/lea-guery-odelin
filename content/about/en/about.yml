title: "The Artist"
biography_1: "International trained harpist, graduate of the Conservatoire Régional de Tours and currently pursuing a specialized Bachelor at MDW University in Vienna. Léa embodies artistic excellence and professional rigor, mastering the most delicate contrasts from classical repertoire to grand-scale symphonies."
biography_2: "Regularly called for prestigious institutions, state ceremonies and high-level private concerts, she brings exceptional artistic dimension to every performance. Her approach combines refined listening, impeccable technique and remarkable stage presence."
