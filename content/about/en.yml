title: "About"
biography: |
  Léa Guéry-Odelin is a professional harpist recognized for her classical interpretation and musical versatility. With solid training and several years of experience, she performs in various contexts: classical concerts, private events, weddings, and festivals.

  Passionate about teaching, she also offers training and workshops for all levels.

portrait_image: "/DB/Lea-Guery.jpg"

specialties:
  - Classical and Baroque music
  - Contemporary arrangements
  - Event performances (weddings, celebrations)
  - Teaching and training
  - Chamber music
