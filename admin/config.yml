backend:
  name: github
  repo: romaingueryodelin/lea-guery-odelin
  branch: main
  auth_endpoint: /auth.html

media_folder: DB/uploads
public_folder: /DB/uploads
publish_mode: editorial_workflow

i18n:
  structure: multiple_folders
  locales: [fr, en, de]
  default_locale: fr

collections:
  # Site Metadata
  - name: settings
    label: "Paramètres du Site"
    files:
      - name: general
        label: "Informations Générales"
        file: content/settings.yml
        fields:
          - { label: "Titre du site", name: site_title, widget: string }
          - { label: "Description", name: site_description, widget: text }
          - { label: "Email de contact", name: contact_email, widget: string }
          - { label: "Logo (FR)", name: logo_fr, widget: image }
          - { label: "Logo (EN)", name: logo_en, widget: image }
          - { label: "Logo (DE)", name: logo_de, widget: image }

  # À Propos
  - name: about
    label: "À Propos"
    folder: content/about
    i18n: true
    format: yml
    create: false
    files:
      - name: index
        label: "Section À Propos"
        file: "{{locale}}.yml"
        fields:
          - { label: "Titre", name: title, widget: string, i18n: true }
          - { label: "Biographie", name: biography, widget: markdown, i18n: true }
          - { label: "Image Portrait", name: portrait_image, widget: image }
          - { label: "Spécialités", name: specialties, widget: list, i18n: true, fields: [{ label: "Spécialité", name: specialty, widget: string }] }

  # Services
  - name: services
    label: "Services"
    folder: content/services
    i18n: true
    format: yml
    create: true
    fields:
      - { label: "Nom du service", name: title, widget: string, i18n: true }
      - { label: "Description", name: description, widget: markdown, i18n: true }
      - { label: "Détails", name: details, widget: text, i18n: true }
      - { label: "Public", name: audience, widget: string, i18n: true }
      - { label: "Tarifs (optionnel)", name: pricing, widget: string, required: false }
      - { label: "Icône/Emoji", name: icon, widget: string }

  # Formation & Diplômes
  - name: skills
    label: "Formation & Certifications"
    folder: content/skills
    i18n: true
    format: yml
    create: true
    fields:
      - { label: "Diplôme/Certification", name: title, widget: string, i18n: true }
      - { label: "École/Institution", name: institution, widget: string }
      - { label: "Année", name: year, widget: number }
      - { label: "Description", name: description, widget: text, i18n: true, required: false }

  # Parcours & Expériences
  - name: experiences
    label: "Parcours Artistique"
    folder: content/experiences
    i18n: true
    format: yml
    create: true
    fields:
      - { label: "Titre du projet/événement", name: title, widget: string, i18n: true }
      - { label: "Description", name: description, widget: markdown, i18n: true }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: "Lieu", name: location, widget: string }
      - { label: "Type", name: type, widget: select, options: ["concert", "festival", "collaboration", "project", "other"], i18n: false }
      - { label: "Image (optionnel)", name: image, widget: image, required: false }

  # Galerie
  - name: gallery
    label: "Galerie"
    folder: content/gallery
    format: yml
    create: true
    fields:
      - { label: "Titre de l'image", name: title, widget: string, i18n: false }
      - { label: "Image", name: image, widget: image }
      - { label: "Description", name: description, widget: text }
      - { label: "Catégorie", name: category, widget: select, options: ["portrait", "performance", "event", "other"] }
      - { label: "Date (optionnel)", name: date, widget: datetime, format: "YYYY-MM-DD", required: false }

  # Vidéos
  - name: videos
    label: "Vidéos"
    folder: content/videos
    format: yml
    create: true
    fields:
      - { label: "Titre", name: title, widget: string }
      - { label: "URL YouTube", name: youtube_url, widget: string, pattern: ["^https://youtu", "Doit commencer par https://youtu"] }
      - { label: "Description", name: description, widget: markdown, required: false }
      - { label: "Type", name: type, widget: select, options: ["solo", "collaboration", "concert", "masterclass", "other"] }

  # Témoignages
  - name: testimonials
    label: "Témoignages & Références"
    folder: content/testimonials
    i18n: true
    format: yml
    create: true
    fields:
      - { label: "Auteur", name: author, widget: string }
      - { label: "Titre/Poste", name: title, widget: string }
      - { label: "Texte", name: text, widget: markdown, i18n: true }
      - { label: "Photo (optionnel)", name: image, widget: image, required: false }
      - { label: "Lien (optionnel)", name: link, widget: string, required: false }

  # Contact & Informations
  - name: contact
    label: "Informations de Contact"
    folder: content/contact
    i18n: true
    format: yml
    create: false
    files:
      - name: index
        label: "Détails de Contact"
        file: "{{locale}}.yml"
        fields:
          - { label: "Titre", name: title, widget: string, i18n: true }
          - { label: "Description", name: description, widget: markdown, i18n: true }
          - { label: "Email", name: email, widget: string }
          - { label: "Téléphone (optionnel)", name: phone, widget: string, required: false }
          - { label: "Ville", name: city, widget: string }
          - { label: "Liens Réseaux", name: social_links, widget: list, fields: [
              { label: "Plateforme", name: platform, widget: select, options: ["instagram", "linkedin", "youtube", "facebook"] },
              { label: "URL", name: url, widget: string }
            ], required: false }

  # Blog (optionnel - pour actualités futures)
  - name: blog
    label: "Actualités & Blog"
    folder: content/blog
    i18n: true
    format: yml
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: title, widget: string, i18n: true }
      - { label: "Contenu", name: body, widget: markdown, i18n: true }
      - { label: "Date de publication", name: published_date, widget: datetime, format: "YYYY-MM-DD HH:mm" }
      - { label: "Image d'en-tête", name: featured_image, widget: image }
      - { label: "Description courte", name: excerpt, widget: text, i18n: true }
      - { label: "Tags", name: tags, widget: list, allow_add: true }
      - { label: "Statut", name: status, widget: select, options: ["draft", "published"] }
