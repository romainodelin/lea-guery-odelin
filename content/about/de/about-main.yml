title: "Die Künstlerin"
biography_1: "International ausgebildete Harfenistin, Absolventin des Conservatoire Régional de Tours und derzeit in einem spezialisierten Bachelor an der MDW Universität Wien. Léa verkörpert künstlerische Exzellenz und berufliche Präzision und beherrscht die subtilsten Kontraste vom klassischen Repertoire bis zu großangelegten Sinfonien."
biography_2: "Regelmäßig für prestigeträchtige Institutionen, staatliche Zeremonien und hochwertige Privatkonzerte engagiert, bringt sie zu jedem Auftritt eine außergewöhnliche künstlerische Dimension. Ihr Ansatz verbindet verfeinerte Musikalität, makellose Technik und bemerkenswerte Bühnenpräsenz."
