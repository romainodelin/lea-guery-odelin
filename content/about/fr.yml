title: "À Propos"
biography: |
  Léa Guéry-Odelin est une harpiste professionnelle reconnue pour son interprétation classique et sa versatilité musicale. Avec une formation solide et plusieurs années d'expérience, elle se produit dans des contextes variés : concerts classiques, événements privés, mariages et festivals.

  Passionnée par la transmission, elle propose également des formations et des ateliers pour tous les niveaux.

portrait_image: "/DB/Lea-Guery.jpg"

specialties:
  - Musique classique et baroque
  - Arrangements contemporains
  - Performances d'événements (mariages, célébrations)
  - Enseignement et formation
  - Musique de chambre
