title: "L'Artiste"
biography_1: "Harpiste de formation internationale, diplômée du Conservatoire Régional de Tours et en Bachelor spécialisé à l'université MDW de Vienne. Léa incarne l'excellence artistique et la rigueur professionnelle, maîtrisant les contrastes les plus délicats du répertoire classique aux symphonies orchestrales d'envergure."
biography_2: "Régulièrement appelée pour les événements d'institutions prestigieuses, de cérémonies d'État et de concerts privés de très haut niveau, elle apporte à chaque prestation une dimension artistique exceptionnelle. Son approche allie écoute raffinée, technique impeccable et présence scénique remarquable."
